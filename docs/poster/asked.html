<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nyuad.life poster: Someone already asked (A3)</title>
<link rel="stylesheet" href="poster.css">
<script src="fit.js" defer></script>
<style>
  /* The site's mark, blown up: a square, the same square turned 45°, an amber sun in the middle. */
  .star { position: absolute; left: 92mm; top: 140mm; width: 250mm; height: 250mm; }
</style>
</head>
<body>
<div class="poster">

  <svg class="pattern" viewBox="0 0 297 420" aria-hidden="true">
    <defs>
      <pattern id="tile" width="27" height="27" patternUnits="userSpaceOnUse">
        <g fill="none" stroke-opacity=".055" stroke-width=".45">
          <rect x="7.5" y="7.5" width="12" height="12"/>
          <rect x="7.5" y="7.5" width="12" height="12" transform="rotate(45 13.5 13.5)"/>
        </g>
      </pattern>
    </defs>
    <rect width="297" height="420" fill="url(#tile)"/>
  </svg>

  <svg class="star" viewBox="-150 -150 300 300" aria-hidden="true">
    <defs>
      <radialGradient id="sun">
        <stop offset="0" stop-color="#ffc21a" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ffc21a" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle r="70" fill="url(#sun)"/>
    <g fill="none" stroke-linejoin="round">
      <g stroke="#2a63ff" stroke-opacity=".35" stroke-width="1.2">
        <rect x="-140" y="-140" width="280" height="280" rx="6"/>
        <rect x="-140" y="-140" width="280" height="280" rx="6" transform="rotate(45)"/>
      </g>
      <g stroke="#4f82ff" stroke-opacity=".6" stroke-width="2">
        <rect x="-110" y="-110" width="220" height="220" rx="5" transform="rotate(22.5)"/>
        <rect x="-110" y="-110" width="220" height="220" rx="5" transform="rotate(67.5)"/>
      </g>
      <g stroke="#f0f2fa" stroke-width="6">
        <rect x="-78" y="-78" width="156" height="156" rx="7"/>
        <rect x="-78" y="-78" width="156" height="156" rx="7" transform="rotate(45)"/>
      </g>
      <g stroke="#ffc21a" stroke-width="2.4">
        <rect x="-48" y="-48" width="96" height="96" rx="4" transform="rotate(22.5)"/>
        <rect x="-48" y="-48" width="96" height="96" rx="4" transform="rotate(67.5)"/>
      </g>
    </g>
    <circle r="22" fill="#ffc21a"/>
  </svg>

  <h1 class="head" style="font-size:81mm; letter-spacing:-1.2mm; right:10mm">
    <span>Someone</span>
    <span>already</span>
    <span class="accent">asked.</span>
  </h1>

  <div class="q paper l"  style="left:14mm;  top:216mm; transform:rotate(-3deg)">Who's the best prof for Calc?</div>
  <div class="q amber r"  style="left:170mm; top:213mm; transform:rotate(3deg)">Cheapest way to Dubai?</div>
  <div class="q cobalt l" style="left:28mm;  top:247mm; transform:rotate(2deg)">Which Arts Core has no final?</div>
  <div class="q paper r"  style="left:178mm; top:243mm; transform:rotate(-2deg); font-size:6.6mm">Where can I print at 2am?</div>
  <div class="q ghost r"  style="left:150mm; top:276mm; transform:rotate(-3deg)">Fridays off. Possible?</div>

  <p class="sub" style="top:300mm; width:130mm">
    <b>13,000+ forum threads,</b><br>
    official pages and Albert.<br>
    Cited answers in seconds.
  </p>

  <footer class="foot">
    <div>
      <div class="url">nyuad.life</div>
      <div class="tags">Ask<i>/</i>Plan<i>/</i>Reviews<i>/</i>Market</div>
    </div>
    <div class="scan">
      <div class="box"><img class="qr" src="qr.svg" alt=""><img class="badge" src="../../web/public/favicon.svg" alt=""></div>
      <div class="label">Scan &amp; ask</div>
    </div>
  </footer>

</div>
</body>
</html>
