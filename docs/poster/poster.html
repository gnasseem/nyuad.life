<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nyuad.life poster (A3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hubot+Sans:wdth,wght@75..125,500..900&family=Mona+Sans:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<style>
  @page { size: 297mm 420mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0a1130; }
  :root {
    --navy: #0a1130; --navy-2: #121b42; --paper: #f0f2fa;
    --amber: #ffc21a; --cobalt: #2a63ff; --sky: #8fb0ff;
  }
  .poster {
    position: relative; width: 297mm; height: 420mm; overflow: hidden;
    background: radial-gradient(120% 70% at 85% 52%, #16246a 0%, #0a1130 58%);
    color: var(--paper);
    font-family: "Mona Sans", sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .pattern { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* The site's mark, blown up: a square, the same square turned 45°, an amber sun in the middle. */
  .star { position: absolute; left: 92mm; top: 140mm; width: 250mm; height: 250mm; }

  .head {
    position: absolute; left: 14mm; top: 14mm; right: 10mm;
    font-family: "Hubot Sans", sans-serif; font-weight: 900;
    font-stretch: 75%; text-transform: uppercase;
    font-size: 81mm; line-height: .82; letter-spacing: -1.2mm;
  }
  .head span { display: block; }
  .head .amber { color: var(--amber); }

  .q {
    position: absolute; padding: 4.2mm 6mm 4.6mm; border-radius: 6mm;
    font-family: "Hubot Sans", sans-serif; font-weight: 700; font-stretch: 90%;
    font-size: 8.4mm; line-height: 1.05; white-space: nowrap;
    box-shadow: 0 1.6mm 0 #050a1f;
  }
  .q::after {
    content: ""; position: absolute; bottom: -3.2mm; width: 7mm; height: 7mm;
    background: inherit; transform: rotate(45deg); border-radius: 1mm; z-index: -1;
  }
  .q.l::after { left: 8mm; }
  .q.r::after { right: 8mm; }
  .q.paper { background: var(--paper); color: var(--navy); }
  .q.amber { background: var(--amber); color: var(--navy); }
  .q.cobalt { background: var(--cobalt); color: #fff; }
  .q.ghost { background: var(--navy-2); color: var(--paper); border: .6mm solid rgba(240, 242, 250, .25); }

  .answer {
    position: absolute; left: 14mm; top: 300mm; width: 130mm;
    font-size: 7.8mm; line-height: 1.18; font-weight: 500; color: #c9cfe6;
  }
  .answer b { color: var(--paper); font-weight: 800; }

  .foot {
    position: absolute; left: 0; right: 0; bottom: 0; height: 78mm;
    background: var(--amber); color: var(--navy);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14mm;
  }
  .url {
    font-family: "Hubot Sans", sans-serif; font-weight: 900; font-stretch: 80%;
    font-size: 46mm; line-height: .9; letter-spacing: -1mm;
  }
  .tags {
    margin-top: 5mm; font-family: "Hubot Sans", sans-serif; font-weight: 800;
    font-size: 6mm; letter-spacing: .5mm; text-transform: uppercase;
  }
  .tags i { font-style: normal; opacity: .45; padding: 0 2mm; }
  .scan { display: flex; flex-direction: column; align-items: center; gap: 2.4mm; }
  .scan .box {
    position: relative; width: 62mm; height: 62mm; background: #fff;
    border-radius: 4mm; padding: 1mm; transform: rotate(3deg);
    box-shadow: 0 2.5mm 0 var(--navy);
  }
  .qr { display: block; width: 100%; height: 100%; }
  .badge { position: absolute; left: 50%; top: 50%; width: 12mm; height: 12mm; transform: translate(-50%, -50%); }
  .scan .label {
    font-family: "Hubot Sans", sans-serif; font-weight: 900; font-size: 5.2mm;
    letter-spacing: 1mm; text-transform: uppercase;
  }
</style>
</head>
