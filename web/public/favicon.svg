<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #111111; } .fg { stroke: #ffffff; } .dot { fill: #ffffff; }
    @media (prefers-color-scheme: dark) { .bg { fill: #ffffff; } .fg { stroke: #111111; } .dot { fill: #111111; } }
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <g class="fg" fill="none" stroke-width="4" stroke-linejoin="round">
    <rect x="17" y="17" width="30" height="30" rx="7"/>
    <rect x="17" y="17" width="30" height="30" rx="7" transform="rotate(45 32 32)"/>
  </g>
  <circle class="dot" cx="32" cy="32" r="4.5"/>
</svg>
