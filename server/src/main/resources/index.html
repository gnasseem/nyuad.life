<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROR Answers</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1a1a1a; --card: #fff; --muted: #6b6b6b; --accent: #5b3df5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141416; --fg: #ececec; --card: #1f1f23; --muted: #9a9a9a; --accent: #9d8bff; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid #8884; background: var(--card); color: var(--fg); }
  button { font: inherit; padding: 12px 18px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  #status { color: var(--muted); margin: 12px 0; min-height: 1.5em; }
  .turn { margin: 24px 0; }
  .q { font-weight: 600; margin-bottom: 8px; }
  .a { background: var(--card); border-radius: 12px; padding: 16px; white-space: pre-wrap; }
  .err { color: #c0392b; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); }
  .src { background: var(--card); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
  .src .meta { color: var(--muted); }
  .src .text { white-space: pre-wrap; max-height: 6em; overflow: hidden; }
  .src .text.open { max-height: none; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>ROR Answers</h1>
  <p class="sub">Ask anything about NYUAD courses, professors, study away, housing. Answers come only from Room of Requirement posts.</p>
  <form id="f"><input id="q" autofocus placeholder="How is Calculus with Dania Zantut?"><button id="b">Ask</button></form>
  <div id="status"></div>
  <div id="log"></div>
</main>
<script>
const f = document.getElementById('f'), q = document.getElementById('q'), b = document.getElementById('b'), status = document.getElementById('status'), log = document.getElementById('log');
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^- (.*)$/gm, '• $1');
f.onsubmit = async e => {
  e.preventDefault();
  const question = q.value.trim(); if (!question) return;
  b.disabled = true; status.textContent = 'Searching the Room of Requirement…';
  const turn = document.createElement('div'); turn.className = 'turn';
  turn.innerHTML = '<div class="q">' + esc(question) + '</div><div class="a">…</div>';
  log.appendChild(turn); q.value = '';
  try {
    const r = await (await fetch('/ask', { method: 'POST', body: question })).json();
    const a = turn.querySelector('.a');
    if (r.error) { a.innerHTML = '<span class="err">' + esc(r.error) + '</span>'; }
    else {
      a.innerHTML = md(r.text);
      const d = document.createElement('details');
      d.innerHTML = '<summary>Sources (' + r.sources.length + ')</summary>' + r.sources.map((s, i) =>
        '<div class="src"><div class="meta">[' + (i + 1) + '] ' + esc(s.author) + (s.date ? ', ' + esc(s.date) : '') +
        (s.url ? ' · <a href="' + esc(s.url) + '" target="_blank">Open post</a>' : '') + '</div><div class="text" onclick="this.classList.toggle(\'open\')">' + esc(s.text) + '</div></div>').join('');
      turn.appendChild(d);
    }
  } catch (err) { turn.querySelector('.a').innerHTML = '<span class="err">' + esc(String(err)) + '</span>'; }
  status.textContent = ''; b.disabled = false; turn.scrollIntoView({ behavior: 'smooth', block: 'end' });
};
</script>
</body>
</html>
