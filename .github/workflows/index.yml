# Builds the search index whenever new posts land, so nobody has to run the indexer by hand.
# Needs one embedding key as a repository secret (Settings → Secrets and variables → Actions):
#   VOYAGE_API_KEY (recommended), or CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID, or GEMINI_API_KEY.
# The committed data/index/ is what Vercel deploys; only chunks that changed get embedded.
name: Build search index

on:
  push:
    branches:
      - main
    paths:
      - 'data/posts.jsonl'
      - 'lib/**'
      - 'scripts/index.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Embed new posts and commit the index
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          VOYAGE_EMBED_MODEL: ${{ vars.VOYAGE_EMBED_MODEL }}
          VOYAGE_EMBED_DIMENSIONS: ${{ vars.VOYAGE_EMBED_DIMENSIONS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMBED_MODEL: ${{ vars.CLOUDFLARE_EMBED_MODEL }}
          CLOUDFLARE_EMBED_DIMENSIONS: ${{ vars.CLOUDFLARE_EMBED_DIMENSIONS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBED_MODEL: ${{ vars.GEMINI_EMBED_MODEL }}
          GEMINI_EMBED_DIMENSIONS: ${{ vars.GEMINI_EMBED_DIMENSIONS }}
          ROR_EMBED_PROVIDER: ${{ vars.ROR_EMBED_PROVIDER }}
        run: |
          if [ -z "$VOYAGE_API_KEY" ] && [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::No embedding key is set (VOYAGE_API_KEY, CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID, or GEMINI_API_KEY), so the index was not built. Add one under Settings → Secrets → Actions."
            exit 0
          fi
          npm run index
          rm -f data/index/cache-*
          git config user.name "ror-indexer"
          git config user.email "ror-indexer@users.noreply.github.com"
          git add data/index
          if git diff --cached --quiet; then
            echo "Index unchanged."
          else
            git commit -m "Update search index [skip ci]"
            git push
          fi
