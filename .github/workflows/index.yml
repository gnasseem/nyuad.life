# Builds the search index whenever the indexing code changes or a scrape asks for it (scripts/scrape-publish.sh runs
# it by hand), so nobody has to run the indexer by hand.
# Needs repository secrets (Settings → Secrets and variables → Actions): BLOB_READ_WRITE_TOKEN for the project's private
# Blob store, and one embedding key: VOYAGE_API_KEY (recommended), or CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID, or
# GEMINI_API_KEY.
# The posts and the index hold students' names and words, so they stay in the store and never touch git: the job pulls
# the posts and the last index, embeds only the chunks that changed, and pushes the new index back. The next deploy
# pulls it.
name: Build search index

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'scripts/index.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Embed new posts and push the index to the store
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          VOYAGE_EMBED_MODEL: ${{ vars.VOYAGE_EMBED_MODEL }}
          VOYAGE_EMBED_DIMENSIONS: ${{ vars.VOYAGE_EMBED_DIMENSIONS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMBED_MODEL: ${{ vars.CLOUDFLARE_EMBED_MODEL }}
          CLOUDFLARE_EMBED_DIMENSIONS: ${{ vars.CLOUDFLARE_EMBED_DIMENSIONS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBED_MODEL: ${{ vars.GEMINI_EMBED_MODEL }}
          GEMINI_EMBED_DIMENSIONS: ${{ vars.GEMINI_EMBED_DIMENSIONS }}
          ROR_EMBED_PROVIDER: ${{ vars.ROR_EMBED_PROVIDER }}
        run: |
          if [ -z "$VOYAGE_API_KEY" ] && [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::No embedding key is set (VOYAGE_API_KEY, CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID, or GEMINI_API_KEY), so the index was not built. Add one under Settings → Secrets → Actions."
            exit 0
          fi
          npm run archive -- pull posts
          npm run archive -- pull index
          npm run index
          npm run archive -- push index
